# Mode HEMAT RESOURCE: 1 container saja (Nginx + PHP-FPM + scheduler), memakai
# MySQL 8 yang SUDAH berjalan di VPS (container `ecommerce-db`) lewat network
# Docker miliknya. ERP memakai database & user sendiri — tidak menyentuh database lain.
# Mode lengkap dengan MySQL sendiri: docker-compose.standalone.yml
#   (docker compose -f docker-compose.standalone.yml up -d --build)
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Hanya localhost: ERP diakses pengunjung lewat Nginx host (domain/HTTPS), bukan
      # langsung lewat IP:port. Docker melewati firewall panel, jadi pembatasan harus di sini.
      - "127.0.0.1:${APP_PORT:-8083}:80"
    volumes:
      # Upload user (siteplan, dokumen konsumen) harus bertahan lintas rebuild image.
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    networks:
      - shared-db

networks:
  shared-db:
    external: true
    name: ${SHARED_DB_NETWORK:-belajarecomerce_ecommerce-network}

volumes:
  storage_app:
  storage_logs:
