server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    # Upload/dokumen konsumen/foto siteplan bisa besar & lama diproses
    # (generate Excel/Word) — jangan pakai default 60s.
    fastcgi_read_timeout 120;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /media/... (gambar/dokumen yang diunggah) dilayani Laravel (MediaController), bukan dicari sebagai
    # file statis. Tanpa blok ini, aturan ekstensi gambar di bawah menangkap /media/x.png lalu 404.
    location ^~ /media/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        # Nginx & PHP-FPM jalan di container YANG SAMA (lihat supervisord.conf),
        # jadi lewat localhost, bukan nama service compose.
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Jangan pernah serve file dotfile (.env, .git, dst) kalau somehow
    # ke-copy ke public/ — pertahanan berlapis di luar .dockerignore.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        access_log off;
    }

    access_log /var/log/nginx/erp-access.log;
    error_log /var/log/nginx/erp-error.log;
}
