; Image php:*-fpm membuka FPM di semua antarmuka (listen = 9000), jadi container lain di jaringan
; Docker bersama (ecommerce-db, ecommerce-app, dst.) bisa bicara FastCGI langsung ke FPM ERP
; tanpa lewat Nginx/login. Nginx di container ini memanggil 127.0.0.1:9000 (lihat
; docker/nginx/default.conf), jadi cukup dengarkan di localhost.
; Nama berawalan zzz- supaya dimuat SETELAH zz-docker.conf bawaan image dan menimpanya.
[www]
listen = 127.0.0.1:9000
