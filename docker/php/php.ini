; Override PHP defaults untuk kebutuhan aplikasi ini — upload Excel/foto
; siteplan/dokumen konsumen butuh limit lebih besar dari default PHP.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
date.timezone = Asia/Jakarta

; Pengerasan: jangan umumkan versi PHP lewat header X-Powered-By, dan matikan fitur
; progres-unggah-sesi PHP (tidak dipakai; Laravel mengelola sesinya sendiri).
expose_php = Off
session.upload_progress.enabled = 0
